<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ML-IDS | Intrusion Detection</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
    margin: 0; padding: 40px 20px;
    min-height: 100vh;
  }
  .container { max-width: 700px; margin: 0 auto; }
  h1 { text-align: center; font-size: 28px; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .card h3 { margin-top: 0; color: #38bdf8; font-size: 16px; }
  input[type=file] {
    width: 100%; padding: 10px; background: #0f172a;
    border: 1px dashed #475569; border-radius: 8px; color: #cbd5e1;
  }
  textarea {
    width: 100%; background: #0f172a; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 8px; padding: 12px;
    font-family: monospace; font-size: 13px; resize: vertical;
  }
  button {
    margin-top: 14px; padding: 10px 22px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #0ea5e9, #38bdf8);
    color: #fff; font-weight: 600; cursor: pointer; font-size: 14px;
    transition: transform 0.15s;
  }
  button:hover { transform: translateY(-2px); }
  #result {
    margin-top: 16px; padding: 14px; border-radius: 8px; font-weight: 600;
    display: none; font-size: 15px;
  }
  .normal { background: #14532d; color: #86efac; display: block !important; }
  .attack { background: #7f1d1d; color: #fca5a5; display: block !important; }
  table {
    width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px;
  }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #334155; }
  th { color: #38bdf8; }
  .badge {
    padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
  }
  .badge.normal { background: #14532d; color: #86efac; }
  .badge.attack { background: #7f1d1d; color: #fca5a5; }
  .spinner { display: none; text-align: center; color: #94a3b8; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <h1>🛡️ ML-Based Intrusion Detection System</h1>
  <div class="subtitle">Upload traffic logs or test a single connection record</div>

  <div class="card">
    <h3>📂 Option A — Upload a CSV file</h3>
    <input type="file" id="csvFile" accept=".csv">
    <br>
    <button onclick="predictCsv()">Analyze CSV</button>
    <div class="spinner" id="csvSpinner">Analyzing traffic...</div>
    <div id="csvSummary"></div>
    <div style="max-height:300px; overflow:auto;">
      <table id="csvTable" style="display:none;">
        <thead><tr><th>Row</th><th>Prediction</th><th>Confidence</th></tr></thead>
        <tbody id="csvBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>📝 Option B — Paste one record as JSON</h3>
    <textarea id="input" rows="6" placeholder='{"dur":0.12,"proto":"tcp","service":"-","state":"FIN", ...}'></textarea>
    <br>
    <button onclick="predict()">Check Record</button>
    <div id="result"></div>
  </div>
</div>

<script>
const API = "http://127.0.0.1:8000";

async function predictCsv() {
  const file = document.getElementById("csvFile").files[0];
  if (!file) { alert("Please choose a CSV file first."); return; }
  document.getElementById("csvSpinner").style.display = "block";
  document.getElementById("csvTable").style.display = "none";
  document.getElementById("csvSummary").innerHTML = "";

  const form = new FormData();
  form.append("file", file);
  try {
    const res = await fetch(`${API}/predict_csv`, { method: "POST", body: form });
    const rows = await res.json();
    document.getElementById("csvSpinner").style.display = "none";

    const attacks = rows.filter(r => r.label === 1).length;
    document.getElementById("csvSummary").innerHTML =
      `<b>${rows.length}</b> records analyzed — <span style="color:#fca5a5">${attacks} flagged as attacks</span>, <span style="color:#86efac">${rows.length-attacks} normal</span>.`;

    const body = document.getElementById("csvBody");
    body.innerHTML = "";
    rows.slice(0, 200).forEach(r => {
      const tr = document.createElement("tr");
      const cls = r.label === 1 ? "attack" : "normal";
      tr.innerHTML = `<td>${r.row}</td><td><span class="badge ${cls}">${r.label===1?"⚠ Attack":"✅ Normal"}</span></td><td>${(r.probability*100).toFixed(1)}%</td>`;
      body.appendChild(tr);
    });
    document.getElementById("csvTable").style.display = "table";
  } catch (e) {
    document.getElementById("csvSpinner").style.display = "none";
    document.getElementById("csvSummary").innerHTML = `<span style="color:#fca5a5">Error: ${e.message}</span>`;
  }
}

async function predict() {
  const box = document.getElementById("result");
  try {
    const data = JSON.parse(document.getElementById("input").value);
    const res = await fetch(`${API}/predict`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data })
    });
    const json = await res.json();
    box.className = json.label === 1 ? "attack" : "normal";
    box.innerText = json.label === 1
      ? `⚠️ ATTACK DETECTED — confidence ${(json.probability*100).toFixed(1)}%`
      : `✅ NORMAL TRAFFIC — confidence ${((1-json.probability)*100).toFixed(1)}%`;
  } catch (e) {
    box.className = "attack";
    box.innerText = "Error: " + e.message + " (check your JSON format)";
  }
}
</script>
</body>
</html>
